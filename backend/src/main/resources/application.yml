spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ops_queue}
    username: ${DB_USER:ops_queue}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
