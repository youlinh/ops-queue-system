spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ops_queue}
    username: ${DB_RUNTIME_USER:${DB_USER:ops_queue}}
    password: ${DB_RUNTIME_PASSWORD:${DB_PASSWORD}}
  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ops_queue}
    user: ${DB_MIGRATION_USER:${DB_USER:ops_queue}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
