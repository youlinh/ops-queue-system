spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ops_queue}
    username: ${DB_RUNTIME_USER}
    password: ${DB_RUNTIME_PASSWORD}
  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ops_queue}
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # Above the roster parser's own 1 MB cap so oversized uploads reach its
      # clean rejection path; Spring only guards against grossly large bodies.
      max-file-size: 2MB
      max-request-size: 3MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
